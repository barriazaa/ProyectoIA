<h3>1. Ingreso de Datos</h3>
<div style="display: flex; gap: 12px;" class="control-group">
    <div style="flex: 1;">
        <label>Eje X (Independiente)</label>
        <input type="number" id="input-x" placeholder="Ej. 2">
    </div>
    <div style="flex: 1;">
        <label>Eje Y (Dependiente)</label>
        <input type="number" id="input-y" placeholder="Ej. 10">
    </div>
</div>
<button class="btn btn-add" id="btn-add">Añadir Punto</button>

<div class="table-container" style="max-height: 250px; overflow-y: auto;">
    <table>
        <thead>
            <tr><th>N</th><th>X</th><th>Y</th><th>Y^</th><th>Error</th><th>Error²</th></tr>
        </thead>
        <tbody id="data-table-body">
        </tbody>
        <tfoot id="data-table-foot" style="display: none; background: #f8fafc; font-weight: bold; border-top: 2px solid var(--border-color);">
            <tr>
                <td colspan="5" style="text-align: right; padding-right: 15px; color: var(--umg-blue);">Error del Modelo (MSE):</td>
                <td id="mse-table-display" style="color: #e74c3c;">0.00</td>
            </tr>
        </tfoot>
    </table>
</div>

<div style="margin: 20px 0; height: 1px; background: var(--border-color);"></div>

<h3>2. Parámetros Iniciales</h3>
<div class="control-group">
    <label>Pendiente Inicial (m)</label>
    <input type="number" id="input-m-init" value="4" step="0.1">
</div>
<div class="control-group">
    <label>Intercepto Inicial (b)</label>
    <input type="number" id="input-b-init" value="0" step="0.1">
</div>
<div class="control-group">
    <label>Tasa de Aprendizaje (α)</label>
    <input type="number" id="input-alpha" value="0.01" step="0.001">
</div>
<div class="control-group">
    <label>Iteraciones Totales</label>
    <input type="number" id="input-iterations" value="100">
</div>

<button class="btn btn-step" id="btn-step">Ejecutar Paso a Paso</button>
<button class="btn btn-full" id="btn-full">Ejecutar Modelo Completo</button>
