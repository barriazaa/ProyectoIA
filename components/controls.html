<h3>1. Ingreso de Datos</h3>

<div class="control-grid">
    <div class="control-group">
        <label for="input-x">Eje X (Independiente)</label>
        <input type="number" id="input-x" placeholder="Ej. 2">
    </div>

    <div class="control-group">
        <label for="input-y">Eje Y (Dependiente)</label>
        <input type="number" id="input-y" placeholder="Ej. 10">
    </div>
</div>

<button class="btn btn-add" id="btn-add">Añadir Punto
</button>

<div class="section-divider"></div>

<h3>2. Parámetros Iniciales</h3>

<div class="control-group">
    <label for="input-m-init">Pendiente Inicial (m)</label>
    <input type="number" id="input-m-init" value="4" step="0.1">
</div>

<div class="control-group">
    <label for="input-b-init">Intercepto Inicial (b)</label>
    <input type="number" id="input-b-init" value="0" step="0.1">
</div>

<div class="control-group">
    <label for="input-alpha">Tasa de Aprendizaje (α)</label>
    <input type="number" id="input-alpha" value="0.01" step="0.001">
</div>

<div class="control-group">
    <label for="input-iterations">Iteraciones Totales</label>
    <input type="number" id="input-iterations" value="100">
</div>

<div class="btn-group">
    <button class="btn btn-step" id="btn-step">Ejecutar Paso a Paso</button>
    <button class="btn btn-full" id="btn-full">Ejecutar Modelo Completo</button>
</div>
